<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>基準値</title>
  </head>
  <body>
    <header class="top">
      <strong>基準値</strong>
      <span>出典: e-Gov 法令API</span>
    </header>
    <main class="wrap">
      <h1>法令の基準値</h1>
      <p class="lede">法令名や、大気・土壌・地下水などの言葉で検索できます。法令を開くと、別表と号列記の基準値を表にします。</p>
      <form id="search-form" class="search" role="search">
        <label for="q">検索</label>
        <input id="q" name="q" type="search" autocomplete="off" placeholder="大気、土壌、地下水" />
        <button type="submit">検索</button>
      </form>
      <p class="hints" id="hints">
        例:
        <button type="button" data-q="大気">大気</button>
        <button type="button" data-q="土壌">土壌</button>
        <button type="button" data-q="地下水">地下水</button>
      </p>
      <p id="status" class="status">下の法令から選ぶか、上で検索してください。</p>
      <div id="featured" class="featured"></div>
      <div id="results" class="results" aria-live="polite" hidden></div>
      <div id="detail" class="detail" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
